<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEngine · редактор анимаций</title>
<style>
  :root { color-scheme: dark; --bg: #0f1216; --pan: #1a1f26; --tx: #dfe6ec; --dim: #8b97a3; --ac: #f1c40f; --bad: #e74c3c; --ok: #2ecc71; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx); font: 13px system-ui, sans-serif; height: 100vh; display: grid;
    grid-template: "bar bar" auto "view insp" 1fr "tl tl" auto "cmd cmd" auto / 1fr 260px; }
  #bar { grid-area: bar; display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; background: var(--pan); align-items: center; }
  #bar .sp { flex: 1; }
  button, select, input { background: #262d36; color: var(--tx); border: 1px solid #39424d; border-radius: 4px; padding: 4px 8px; font: inherit; }
  button:hover { border-color: var(--ac); }
  button.on { background: #3b3416; border-color: var(--ac); }
  #view { grid-area: view; width: 100%; height: 100%; min-height: 240px; display: block; cursor: crosshair; }
  #insp { grid-area: insp; background: var(--pan); padding: 8px; overflow: auto; }
  #insp label { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin: 4px 0; }
  #insp input[type=number] { width: 70px; }
  #insp input[type=range] { width: 110px; }
  #insp h3 { margin: 10px 0 4px; font-size: 13px; color: var(--ac); }
  #tlwrap { grid-area: tl; position: relative; background: var(--pan); padding: 4px 6px; }
  #tl { width: 100%; height: 74px; display: block; }
  #cmd { grid-area: cmd; display: flex; gap: 6px; padding: 6px; background: var(--pan); border-top: 1px solid #262d36; }
  #cmd input { flex: 1; }
  #status { color: var(--dim); }
  #tip { position: fixed; pointer-events: none; background: #000d; border: 1px solid var(--bad); padding: 6px 8px; border-radius: 4px; max-width: 360px; display: none; z-index: 5; }
  #hint { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); background: #000b; padding: 14px 18px; border-radius: 8px; max-width: 420px; line-height: 1.5; display: none; }
  .red { color: var(--bad); } .green { color: var(--ok); }
  #log { color: var(--dim); font-size: 12px; white-space: pre-wrap; margin-top: 8px; }
</style>
</head>
<body>
<div id="bar">
  <select id="clips" title="Клипы из tools/anim/motion"></select>
  <select id="tpl" title="Новый клип из заготовки"><option value="">Новый…</option></select>
  <button id="open" title="Открыть JSON с диска">Открыть</button>
  <button id="save" title="Сохранить (Ctrl+S): через editor_server.py — в файл, иначе скачать">Сохранить</button>
  <button id="undo" title="Отменить (Ctrl+Z)">↶</button><button id="redo" title="Вернуть (Ctrl+Shift+Z)">↷</button>
  <button id="play" title="Играть / стоп (пробел)">▶</button>
  <select id="speed" title="Скорость проигрывания"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select>
  <button id="onion" class="on" title="Полупрозрачные соседние кадры">Луковица</button>
  <button id="mirror" title="Зеркало: левая ↔ правая рука">Зеркало</button>
  <select id="addprop" title="Поставить предмет-цель"><option value="">+ предмет</option><option value="lever">рычаг</option><option value="door">ручка двери</option><option value="item">предмет на столе</option></select>
  <button id="fix" title="Ближайшая допустимая поза для красных кадров">Поправить</button>
  <button id="full" title="Полная проверка: keyed.py + check.py (кожа, растяжение, форма кисти) — нужен editor_server.py">Полная проверка</button>
  <span class="sp"></span><span id="status"></span>
  <input id="file" type="file" accept=".json" hidden>
</div>
<canvas id="view"></canvas>
<div id="insp"></div>
<div id="tlwrap"><canvas id="tl"></canvas><div id="hint"></div></div>
<div id="cmd"><input id="ai" placeholder="Команда: «замах медленнее, кисть выше», «поправь», «всё ближе» — Enter" title="Простые команды выполняются сразу; с editor_server.py команда уходит и в сессию ИИ"><button id="aigo">Выполнить</button></div>
<div id="tip"></div>
<script type="module" src="editor.js?b=11240313"></script>
</body>
</html>
